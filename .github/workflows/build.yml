name: Build and Release IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'manual-build'
        type: choice
        options:
          - manual-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build & Package
        run: |
          pnpm run build:dev
          pnpm run package

      # 1. Always upload the build artifact to the workflow summary page
      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-adfree-ipk
          path: '*.ipk'

      # 2. Automatically create a GitHub release if triggered manually or via tag
      - name: Create GitHub Release / Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipk"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-manual' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Manual Build (Latest)' }}
          body: "Automated build of YouTube AdFree for webOS."
          prerelease: ${{ github.ref_type != 'tag' }}
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
