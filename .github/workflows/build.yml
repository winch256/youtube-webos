- name: Build & Package
        run: |
          pnpm run build:dev
          pnpm run package

      # ADD THIS STEP TO RENAME TO A STATIC FILENAME
      - name: Rename IPK to Static Name
        run: |
          mv *.ipk youtube.leanback.v4.ipk

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-adfree-ipk
          path: 'youtube.leanback.v4.ipk' # Update path to match

      - name: Create GitHub Release / Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: "youtube.leanback.v4.ipk" # Point to the static filename
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-manual' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Manual Build (Latest)' }}
          body: "Automated build of YouTube AdFree for webOS."
          prerelease: ${{ github.ref_type != 'tag' }}
          draft: false
          fail_on_unmatched_files: true
          # ADD THIS TO OVERWRITE THE EXISTING MANUAL RELEASE ASSET
          replace_existing_asset: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
